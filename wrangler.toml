name = "mylittlesys"
main = "worker.js"
compatibility_date = "2026-05-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
ADMIN_USER = "admin"
ADMIN_PASS = "admin123"

